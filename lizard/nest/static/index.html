<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lizard Nest</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #626a73;
      --line: #d7dce0;
      --panel: #ffffff;
      --band: #f4f6f8;
      --accent: #0b6b57;
      --accent-2: #315f9f;
      --warn: #af6a00;
      --critical: #b3261e;
      --ok: #137333;
      --shadow: 0 1px 2px rgba(20, 28, 35, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--band);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 22px; line-height: 1.2; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }

    button, select, input, textarea {
      font: inherit;
    }

    button {
      border: 1px solid #075545;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
      border-color: var(--line);
    }

    main {
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px 18px 0;
      max-width: 1600px;
      margin: 0 auto;
    }

    .tab {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: #075545;
    }

    body[data-tab="monitor"] .config-panel,
    body[data-tab="config"] .monitor-panel {
      display: none;
    }

    .sidebar, .content {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-body { padding: 14px; }

    .host-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .host-filter {
      margin-bottom: 10px;
    }

    .toggle {
      display: flex;
      grid-template-columns: none;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--muted);
    }

    .toggle input {
      width: auto;
      margin: 0;
    }

    .host-card {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .host-card.active {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .name {
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      background: #e8f5ee;
      color: var(--ok);
      white-space: nowrap;
    }

    .pill.warn {
      background: #fff3df;
      color: var(--warn);
    }

    .pill.critical {
      background: #fce8e6;
      color: var(--critical);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      min-width: 0;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .metric strong {
      font-size: 22px;
      line-height: 1.1;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(280px, 1fr));
      gap: 14px;
    }

    .chart-box {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .chart-box.wide {
      grid-column: 1 / -1;
    }

    canvas {
      width: 100%;
      height: 210px;
      display: block;
    }

    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      color: var(--ink);
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .app-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .alert-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 7px 6px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .alert {
      border-left: 4px solid var(--warn);
      padding: 8px 10px;
      background: #fff9f0;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    .alert.critical {
      border-left-color: var(--critical);
      background: #fff4f2;
    }

    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      .metrics { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
      .chart-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      main { padding: 10px; }
      header { padding: 14px; }
      .metrics, .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🦎 Lizard Nest</h1>
      <div class="muted small" id="summary">Loading servers...</div>
      <div class="app-status" id="app-status"></div>
    </div>
    <div class="row">
      <button class="secondary" id="refresh">Refresh</button>
      <button id="auto">Auto refresh: on</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" id="tab-monitor" data-tab-target="monitor">Monitor</button>
    <button class="tab" id="tab-config" data-tab-target="config">🥚 Config</button>
  </nav>

  <main>
    <aside class="sidebar">
      <section class="section monitor-panel">
        <div class="section-head">
          <h2>🥚 Eggs</h2>
          <span class="muted small" id="host-count">0</span>
        </div>
        <div class="section-body">
          <label class="toggle small host-filter">
            <input id="hide-offline" type="checkbox">
            Hide offline
          </label>
          <div class="host-list" id="hosts"></div>
        </div>
      </section>

      <section class="section config-panel">
        <div class="section-head">
          <h2>Config Scope</h2>
        </div>
        <div class="section-body">
          <label>
            Target
            <select id="config-scope">
              <option value="global">Global</option>
            </select>
          </label>
          <div class="actions">
            <button class="secondary" id="load-config">Load</button>
          </div>
        </div>
      </section>
    </aside>

    <section class="content">
      <section class="section monitor-panel">
        <div class="section-head">
          <div>
            <h2 id="selected-title">No egg selected</h2>
            <div class="muted small" id="selected-subtitle"></div>
          </div>
          <span class="pill" id="selected-health">idle</span>
        </div>
        <div class="section-body">
          <div class="metrics" id="latest-metrics"></div>
        </div>
      </section>

      <section class="section monitor-panel">
        <div class="section-head">
          <h2>Time Series</h2>
          <div class="row">
            <label class="small">
              Samples
              <select id="series-limit">
                <option>60</option>
                <option selected>240</option>
                <option>720</option>
                <option>1440</option>
              </select>
            </label>
          </div>
        </div>
        <div class="section-body chart-grid">
          <div class="chart-box"><h3>CPU %</h3><canvas id="chart-cpu"></canvas></div>
          <div class="chart-box"><h3>Memory %</h3><canvas id="chart-memory"></canvas></div>
          <div class="chart-box wide"><h3>Per-Core CPU %</h3><canvas id="chart-cpu-cores"></canvas></div>
          <div class="chart-box"><h3>GPU %</h3><canvas id="chart-gpu"></canvas></div>
          <div class="chart-box"><h3>Disk %</h3><canvas id="chart-disk"></canvas></div>
        </div>
      </section>

      <section class="section monitor-panel">
        <div class="section-head">
          <h2>Host Details</h2>
          <button class="secondary" id="refresh-inventory">Refresh inventory</button>
        </div>
        <div class="section-body detail-grid">
          <div>
            <h3>Inventory</h3>
            <div id="inventory-details" class="small"></div>
          </div>

          <div>
            <h3>GPUs</h3>
            <div id="gpu-details"></div>
          </div>

          <div>
            <h3>Disk Details</h3>
            <div id="disk-details"></div>
          </div>
        
        </div>
      </section>

      <section class="section config-panel">
        <div class="section-head">
          <h2>🥚 Local Alert Config</h2>
          <div class="status" id="config-status"></div>
        </div>
        <div class="section-body">
          <div class="form-grid">
            <label>
              Interval seconds
              <input id="interval" type="number" min="1" step="1" placeholder="15">
            </label>
            <label>
              Temperature thresholds
              <input id="temp-thresholds" placeholder="warning:80,critical:90">
            </label>
            <label>
              CPU thresholds
              <input id="cpu-thresholds" placeholder="warning:50,critical:90">
            </label>
            <label>
              Memory thresholds
              <input id="memory-thresholds" placeholder="warning:90,critical:98">
            </label>
            <label>
              Disk thresholds
              <input id="disk-thresholds" placeholder="warning:85,critical:95">
            </label>
            <label>
              GPU thresholds
              <input id="gpu-thresholds" placeholder="warning:90,critical:98">
            </label>
          </div>
          <label>
            JSON payload
            <textarea id="config-json"></textarea>
          </label>
          <div class="actions">
            <button class="secondary" id="build-json">Build JSON</button>
            <button id="save-config">Publish retained config</button>
          </div>
        </div>
      </section>

      <section class="section monitor-panel">
        <div class="section-head"><h2>Latest Alerts</h2></div>
        <div class="section-body alert-list" id="alerts"></div>
      </section>
    </section>
  </main>

  <script>
    const state = {
      servers: [],
      statuses: new Map(),
      inventories: new Map(),
      selectedHostId: null,
      hideOffline: false,
      autoRefresh: true,
      timer: null
    };

    const $ = (id) => document.getElementById(id);

    $("refresh").addEventListener("click", refreshAll);
    $("auto").addEventListener("click", toggleAutoRefresh);
    $("tab-monitor").addEventListener("click", () => setTab("monitor"));
    $("tab-config").addEventListener("click", () => setTab("config"));
    $("series-limit").addEventListener("change", loadSeries);
    $("load-config").addEventListener("click", loadSelectedConfig);
    $("build-json").addEventListener("click", buildConfigJson);
    $("save-config").addEventListener("click", saveConfig);
    $("config-scope").addEventListener("change", loadSelectedConfig);
    $("refresh-inventory").addEventListener("click", refreshInventory);
    $("hide-offline").addEventListener("change", () => {
      state.hideOffline = $("hide-offline").checked;
      renderHosts();
      renderSelected();
      loadSeries();
    });

    document.body.dataset.tab = "monitor";
    refreshAll();
    state.timer = setInterval(() => {
      if (state.autoRefresh) refreshAll();
    }, 15000);

    async function refreshAll() {
      try {
        const [servers, statuses, inventories] = await Promise.all([
          getJson("/servers"),
          getJson("/servers/status"),
          getJson("/servers/inventory")
        ]);
        state.servers = servers;
        state.statuses = new Map(statuses.map((status) => [status.host_id, status]));
        state.inventories = new Map(inventories.map((inventory) => [inventory.host_id, inventory]));
        if (!state.selectedHostId && servers.length) state.selectedHostId = servers[0].host_id;
        if (state.selectedHostId && !servers.find((server) => server.host_id === state.selectedHostId)) {
          state.selectedHostId = servers[0]?.host_id || null;
        }
        renderHosts();
        renderSelected();
        await loadSeries();
      } catch (error) {
        setUiStatus(`Refresh failed: ${error.message}`, true);
      }
    }

    function toggleAutoRefresh() {
      state.autoRefresh = !state.autoRefresh;
      $("auto").textContent = `Auto refresh: ${state.autoRefresh ? "on" : "off"}`;
    }

    function setTab(tab) {
      document.body.dataset.tab = tab;
      document.querySelectorAll(".tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.tabTarget === tab);
      });
    }

    function sortServers(servers) {
      return [...servers].sort((left, right) => {
        const leftState = hostState(left);
        const rightState = hostState(right);
        const stateDelta = stateRank(leftState) - stateRank(rightState);
        if (stateDelta !== 0) return stateDelta;
        return (left.hostname || left.host_id).localeCompare(right.hostname || right.host_id);
      });
    }

    function shouldShowHost(server) {
      return !(state.hideOffline && hostState(server) === "offline");
    }

    function hostState(server) {
      return state.statuses.get(server.host_id)?.state || "unknown";
    }

    function stateRank(hostState) {
      if (hostState === "online") return 0;
      if (hostState === "stale") return 1;
      if (hostState === "unknown") return 2;
      if (hostState === "offline") return 3;
      return 4;
    }

    function countStates(servers) {
      return servers.reduce((counts, server) => {
        const current = hostState(server);
        counts[current] = (counts[current] || 0) + 1;
        return counts;
      }, {online: 0, stale: 0, offline: 0, unknown: 0});
    }

    function renderHosts() {
      const sortedServers = sortServers(state.servers);
      const visibleServers = sortedServers.filter((server) => shouldShowHost(server));
      if (state.selectedHostId && !visibleServers.some((server) => server.host_id === state.selectedHostId)) {
        state.selectedHostId = visibleServers[0]?.host_id || null;
      }
      const counts = countStates(state.servers);
      $("host-count").textContent = state.hideOffline ? `${visibleServers.length}/${state.servers.length}` : `${state.servers.length}`;
      $("summary").textContent = `${counts.online} online, ${counts.stale} stale, ${counts.offline} offline`;
      const hosts = $("hosts");
      hosts.innerHTML = "";
      const scope = $("config-scope");
      const currentScope = scope.value;
      scope.innerHTML = `<option value="global">Global</option>`;

      sortedServers.forEach((server) => {
        const option = document.createElement("option");
        option.value = `host:${server.host_id}`;
        option.textContent = server.host_id;
        scope.appendChild(option);
      });

      visibleServers.forEach((server) => {
        const card = document.createElement("button");
        card.className = `host-card ${server.host_id === state.selectedHostId ? "active" : ""}`;
        card.addEventListener("click", () => {
          state.selectedHostId = server.host_id;
          renderHosts();
          renderSelected();
          loadSeries();
        });
        const alertClass = server.alerts.some((alert) => alert.level === "critical") ? "critical" :
          server.alerts.length ? "warn" : "";
        const status = state.statuses.get(server.host_id);
        card.innerHTML = `
          <div class="row">
            <span class="name">${escapeHtml(server.hostname || server.host_id)}</span>
            <span class="pill ${statusClass(status, alertClass)}">${status ? status.state : "unknown"}</span>
          </div>
          <div class="row small muted">
            <span>CPU ${formatPercent(server.cpu.overall_percent)}</span>
            <span>RAM ${formatPercent(server.memory.percent)}</span>
          </div>
          <div class="small muted">Last seen ${formatAge(status?.age_seconds)} ago</div>
        `;
        hosts.appendChild(card);
      });

      if (!visibleServers.length) {
        hosts.innerHTML = `<div class="muted small">No eggs match this filter.</div>`;
      }

      if ([...scope.options].some((option) => option.value === currentScope)) scope.value = currentScope;
    }

    function renderSelected() {
      const server = selectedServer();
      if (!server) {
        $("selected-title").textContent = "No egg selected";
        $("selected-subtitle").textContent = "";
        $("selected-health").textContent = "idle";
        $("latest-metrics").innerHTML = "";
        $("alerts").innerHTML = "";
        $("disk-details").innerHTML = "";
        $("inventory-details").innerHTML = "";
        $("gpu-details").innerHTML = "";
        return;
      }

      $("selected-title").textContent = server.hostname || server.host_id;
      const status = state.statuses.get(server.host_id);
      $("selected-subtitle").textContent = `${server.host_id} - last seen ${formatAge(status?.age_seconds)} ago`;
      const critical = server.alerts.some((alert) => alert.level === "critical");
      $("selected-health").className = `pill ${statusClass(status, critical ? "critical" : server.alerts.length ? "warn" : "")}`;
      $("selected-health").textContent = status ? status.state : "unknown";

      const gpu = avg(server.gpus.map((item) => item.utilization_percent).filter((value) => value !== null));
      const disk = max(server.disks.map((item) => item.percent));
      $("latest-metrics").innerHTML = `
        ${metricTile("CPU", formatPercent(server.cpu.overall_percent))}
        ${metricTile("RAM", formatPercent(server.memory.percent))}
        ${metricTile("GPU avg", gpu === null ? "n/a" : formatPercent(gpu))}
        ${metricTile("Disk max", disk === null ? "n/a" : formatPercent(disk))}
        ${metricTile("Uptime", formatDuration(server.uptime_seconds))}
        ${metricTile("Last seen", formatAge(status?.age_seconds))}
      `;
      renderDetails(server);

      const alerts = $("alerts");
      alerts.innerHTML = "";
      if (!server.alerts.length) {
        alerts.innerHTML = `<div class="muted">No local alerts in the latest sample.</div>`;
        return;
      }
      server.alerts.forEach((alert) => {
        const item = document.createElement("div");
        item.className = `alert ${alert.level === "critical" ? "critical" : ""}`;
        item.innerHTML = `<strong>${escapeHtml(alert.level)}</strong> ${escapeHtml(alert.message)}`;
        alerts.appendChild(item);
      });
    }

    function renderDetails(server) {
      const inventory = state.inventories.get(server.host_id);
      $("disk-details").innerHTML = table(
        ["Device", "Sampled mount", "Used", "Free", "Usage"],
        server.disks.map((disk) => [
          disk.device,
          disk.mountpoint,
          formatBytes(disk.used_bytes),
          formatBytes(disk.free_bytes),
          formatPercent(disk.percent)
        ])
      );
      $("gpu-details").innerHTML = table(
        ["GPU", "Name", "Usage", "Memory", "Temp"],
        server.gpus.map((gpu) => [
          gpu.index,
          gpu.name,
          gpu.utilization_percent == null ? "n/a" : formatPercent(gpu.utilization_percent),
          gpu.memory_percent == null ? "n/a" : formatPercent(gpu.memory_percent),
          gpu.temperature_celsius == null ? "n/a" : `${gpu.temperature_celsius.toFixed(1)} C`
        ])
      );
      $("inventory-details").innerHTML = inventory ? `
        <div><strong>OS:</strong> ${escapeHtml(inventory.os)} ${escapeHtml(inventory.os_version)}</div>
        <div><strong>Kernel:</strong> ${escapeHtml(inventory.kernel)}</div>
        <div><strong>Architecture:</strong> ${escapeHtml(inventory.architecture)}</div>
        <div><strong>CPU:</strong> ${inventory.cpu_logical_count} logical / ${inventory.cpu_physical_count ?? "n/a"} physical</div>
        <div><strong>Memory:</strong> ${formatBytes(inventory.memory_total_bytes)}</div>
        <div><strong>Disks:</strong> ${inventory.disks.length}</div>
        <div><strong>GPUs:</strong> ${inventory.gpus.length}</div>
        <div><strong>Inventory updated:</strong> ${formatTime(inventory.timestamp)}</div>
      ` : `<div class="muted">No inventory yet.</div>`;
    }

    async function refreshInventory() {
      const hostId = state.selectedHostId;
      if (!hostId) return;
      try {
        await fetch(`/servers/${encodeURIComponent(hostId)}/inventory/refresh`, {method: "POST"}).then(checkResponse);
        setUiStatus("Inventory refresh requested.");
        setTimeout(refreshAll, 1500);
      } catch (error) {
        setUiStatus(`Inventory refresh failed: ${error.message}`, true);
      }
    }

    async function loadSeries() {
      const hostId = state.selectedHostId;
      if (!hostId) {
        drawEmptyCharts();
        return;
      }
      try {
        const limit = $("series-limit").value;
        const rows = await getJson(`/servers/${encodeURIComponent(hostId)}/series?limit=${limit}`);
        drawChart("chart-cpu", rows.map((row) => [row.timestamp, row.cpu.overall_percent]), "#0b6b57");
        drawMultiChart("chart-cpu-cores", buildCoreSeries(rows), [
          "#0b6b57", "#315f9f", "#af6a00", "#7b3f98", "#b3261e", "#137333", "#5f6368", "#00838f"
        ]);
        drawChart("chart-memory", rows.map((row) => [row.timestamp, row.memory.percent]), "#315f9f");
        drawChart("chart-gpu", rows.map((row) => [row.timestamp, avg(row.gpus.map((gpu) => gpu.utilization_percent).filter((value) => value !== null))]), "#7b3f98");
        drawChart("chart-disk", rows.map((row) => [row.timestamp, max(row.disks.map((disk) => disk.percent))]), "#af6a00");
        setUiStatus("");
      } catch (error) {
        drawEmptyCharts();
        setUiStatus(`Series load failed: ${error.message}`, true);
      }
    }

    async function loadSelectedConfig() {
      const scope = $("config-scope").value;
      const path = scope === "global"
        ? "/config/global"
        : `/servers/${encodeURIComponent(scope.replace("host:", ""))}/config`;
      try {
        const envelope = await getJson(path);
        fillConfigForm(envelope ? envelope.config : {});
        const version = envelope ? ` version ${envelope.version}` : "";
        setStatus(`Loaded ${scope}${version}.`);
      } catch (error) {
        setStatus(`Load failed: ${error.message}`, true);
      }
    }

    async function saveConfig() {
      let payload;
      try {
        payload = JSON.parse($("config-json").value || "{}");
      } catch (error) {
        setStatus(`Invalid JSON: ${error.message}`, true);
        return;
      }
      const scope = $("config-scope").value;
      const path = scope === "global"
        ? "/config/global"
        : `/servers/${encodeURIComponent(scope.replace("host:", ""))}/config`;
      try {
        const response = await fetch(path, {
          method: "POST",
          headers: {"content-type": "application/json"},
          body: JSON.stringify(payload)
        }).then(checkResponse);
        const envelope = await response.json();
        setStatus(`Published retained config for ${scope} version ${envelope.version}.`);
      } catch (error) {
        setStatus(`Publish failed: ${error.message}`, true);
      }
    }

    function buildConfigJson() {
      const payload = {};
      const interval = Number($("interval").value);
      if (Number.isFinite(interval) && interval > 0) payload.interval_seconds = interval;
      const fields = [
        ["cpu_percent_thresholds", "cpu-thresholds"],
        ["memory_percent_thresholds", "memory-thresholds"],
        ["disk_percent_thresholds", "disk-thresholds"],
        ["gpu_percent_thresholds", "gpu-thresholds"],
        ["temperature_celsius_thresholds", "temp-thresholds"]
      ];
      fields.forEach(([key, id]) => {
        const thresholds = parseThresholds($(id).value);
        if (thresholds.length) payload[key] = thresholds;
      });
      $("config-json").value = JSON.stringify(payload, null, 2);
      setStatus("JSON ready to publish.");
    }

    function fillConfigForm(config) {
      $("interval").value = config.interval_seconds || "";
      $("cpu-thresholds").value = formatThresholds(config.cpu_percent_thresholds);
      $("memory-thresholds").value = formatThresholds(config.memory_percent_thresholds);
      $("disk-thresholds").value = formatThresholds(config.disk_percent_thresholds);
      $("gpu-thresholds").value = formatThresholds(config.gpu_percent_thresholds);
      $("temp-thresholds").value = formatThresholds(config.temperature_celsius_thresholds);
      $("config-json").value = JSON.stringify(config, null, 2);
    }

    function parseThresholds(value) {
      return value.split(",")
        .map((part) => part.trim())
        .filter(Boolean)
        .map((part) => {
          const [level, rawValue] = part.includes(":") ? part.split(":") : ["warning", part];
          return {level: level.trim(), value: Number(rawValue)};
        })
        .filter((item) => item.level && Number.isFinite(item.value));
    }

    function formatThresholds(thresholds) {
      return (thresholds || []).map((item) => `${item.level}:${item.value}`).join(",");
    }

    function selectedServer() {
      return state.servers.find((server) => server.host_id === state.selectedHostId) || null;
    }

    function metricTile(label, value) {
      return `<div class="metric"><span>${label}</span><strong>${value}</strong></div>`;
    }

    function table(headers, rows) {
      if (!rows.length) return `<div class="muted small">No data.</div>`;
      return `
        <table>
          <thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
          <tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("")}</tbody>
        </table>
      `;
    }

    function drawEmptyCharts() {
      ["chart-cpu", "chart-cpu-cores", "chart-memory", "chart-gpu", "chart-disk"].forEach((id) => drawChart(id, [], "#0b6b57"));
    }

    function drawChart(id, rows, color) {
      const canvas = $(id);
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.max(320, Math.floor(rect.width * scale));
      canvas.height = Math.floor(210 * scale);
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const pad = 34 * scale;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#d7dce0";
      ctx.lineWidth = scale;
      ctx.beginPath();
      ctx.moveTo(pad, 10 * scale);
      ctx.lineTo(pad, height - pad);
      ctx.lineTo(width - 10 * scale, height - pad);
      ctx.stroke();

      const points = rows.filter((row) => row[1] !== null && Number.isFinite(row[1]));
      ctx.fillStyle = "#626a73";
      ctx.font = `${12 * scale}px system-ui`;
      ctx.fillText("0", 8 * scale, height - pad);
      ctx.fillText("100", 8 * scale, 18 * scale);

      if (!points.length) {
        ctx.fillText("No data", pad + 10 * scale, height / 2);
        return;
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5 * scale;
      ctx.beginPath();
      points.forEach((point, index) => {
        const x = pad + ((width - pad - 14 * scale) * index / Math.max(points.length - 1, 1));
        const y = height - pad - ((height - pad - 14 * scale) * Math.max(0, Math.min(100, point[1])) / 100);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      const latest = points[points.length - 1][1];
      ctx.fillStyle = color;
      ctx.fillText(`${latest.toFixed(1)}%`, width - 70 * scale, 18 * scale);
    }

    function buildCoreSeries(rows) {
      const coreCount = rows.reduce((count, row) => Math.max(count, row.cpu.per_core_percent.length), 0);
      return Array.from({length: coreCount}, (_, index) => ({
        label: `CPU ${index}`,
        rows: rows.map((row) => [row.timestamp, row.cpu.per_core_percent[index] ?? null])
      }));
    }

    function drawMultiChart(id, series, colors) {
      const canvas = $(id);
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.max(320, Math.floor(rect.width * scale));
      canvas.height = Math.floor(210 * scale);
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const pad = 34 * scale;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#d7dce0";
      ctx.lineWidth = scale;
      ctx.beginPath();
      ctx.moveTo(pad, 10 * scale);
      ctx.lineTo(pad, height - pad);
      ctx.lineTo(width - 10 * scale, height - pad);
      ctx.stroke();

      ctx.fillStyle = "#626a73";
      ctx.font = `${12 * scale}px system-ui`;
      ctx.fillText("0", 8 * scale, height - pad);
      ctx.fillText("100", 8 * scale, 18 * scale);

      const populated = series
        .map((item) => ({
          label: item.label,
          rows: item.rows.filter((row) => row[1] !== null && Number.isFinite(row[1]))
        }))
        .filter((item) => item.rows.length);

      if (!populated.length) {
        ctx.fillText("No data", pad + 10 * scale, height / 2);
        return;
      }

      populated.forEach((item, seriesIndex) => {
        ctx.strokeStyle = colors[seriesIndex % colors.length];
        ctx.lineWidth = 2 * scale;
        ctx.beginPath();
        item.rows.forEach((point, index) => {
          const x = pad + ((width - pad - 14 * scale) * index / Math.max(item.rows.length - 1, 1));
          const y = height - pad - ((height - pad - 28 * scale) * Math.max(0, Math.min(100, point[1])) / 100);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      });

      const legend = populated.slice(0, 8);
      legend.forEach((item, index) => {
        const x = pad + index * 74 * scale;
        const y = 18 * scale;
        ctx.fillStyle = colors[index % colors.length];
        ctx.fillRect(x, y - 8 * scale, 10 * scale, 10 * scale);
        ctx.fillStyle = "#626a73";
        ctx.fillText(item.label, x + 14 * scale, y);
      });
    }

    async function getJson(path) {
      const response = await fetch(path);
      await checkResponse(response);
      return response.json();
    }

    async function checkResponse(response) {
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(detail || response.statusText);
      }
      return response;
    }

    function setStatus(message, isError = false) {
      const target = $("config-status");
      target.textContent = message;
      target.style.color = isError ? "var(--critical)" : "var(--muted)";
    }

    function setUiStatus(message, isError = false) {
      const target = $("app-status");
      target.textContent = message;
      target.style.color = isError ? "var(--critical)" : "var(--muted)";
    }

    function formatPercent(value) {
      return `${Number(value || 0).toFixed(1)}%`;
    }

    function formatTime(value) {
      return new Date(value).toLocaleString();
    }

    function formatAge(seconds) {
      if (seconds === undefined || seconds === null) return "n/a";
      return formatDuration(seconds);
    }

    function formatDuration(seconds) {
      if (seconds === undefined || seconds === null) return "n/a";
      const whole = Math.max(0, Math.floor(seconds));
      if (whole < 60) return `${whole}s`;
      if (whole < 3600) return `${Math.floor(whole / 60)}m ${whole % 60}s`;
      const hours = Math.floor(whole / 3600);
      const minutes = Math.floor((whole % 3600) / 60);
      return `${hours}h ${minutes}m`;
    }

    function formatBytes(bytes) {
      if (bytes === undefined || bytes === null) return "n/a";
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      let value = Number(bytes);
      let index = 0;
      while (value >= 1024 && index < units.length - 1) {
        value /= 1024;
        index += 1;
      }
      return `${value.toFixed(index === 0 ? 0 : 1)} ${units[index]}`;
    }

    function statusClass(status, fallback) {
      if (!status) return fallback;
      if (status.state === "offline") return "critical";
      if (status.state === "stale") return "warn";
      return fallback;
    }

    function avg(values) {
      if (!values.length) return null;
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    }

    function max(values) {
      const valid = values.filter((value) => value !== null && Number.isFinite(value));
      if (!valid.length) return null;
      return Math.max(...valid);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
