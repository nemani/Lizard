[project]
name = "lizard"
version = "0.1.0"
description = "Linux GPU server monitoring over MQTT."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.112.0",
    "paho-mqtt>=2.1.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.555.43"]
dev = ["pytest>=8.3.0", "ruff>=0.5.0"]

[project.scripts]
lizard-egg = "lizard.egg.agent:main"
lizard-nest = "lizard.nest.server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lizard*"]

[tool.ruff]
line-length = 100
target-version = "py310"
