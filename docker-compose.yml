services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${LIZARD_MQTT_PUBLISHED_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nest:
    build:
      context: .
      target: nest
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_DATA_DIR: /data
      LIZARD_LISTEN_PORT: "8000"
      LIZARD_MAX_JSONL_LINES: "100000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      nest:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lizard
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  egg:
    build:
      context: .
      target: egg
    profiles:
      - egg
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_INTERVAL_SECONDS: "15"
      LIZARD_CPU_PERCENT_THRESHOLDS: '[{"level":"warning","value":50},{"level":"critical","value":90}]'
    volumes:
      - /:/host:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  egg-test:
    build:
      context: .
      target: egg
    profiles:
      - test-hosts
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_INTERVAL_SECONDS: "5"
      LIZARD_CPU_PERCENT_THRESHOLDS: '[{"level":"warning","value":1},{"level":"critical","value":90}]'

volumes:
  mosquitto-data:
  mosquitto-log:
  prometheus-data:
  grafana-data:
