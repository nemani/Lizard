services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${LIZARD_MQTT_PUBLISHED_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  nest:
    build:
      context: .
      target: nest
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_DATA_DIR: /data
      LIZARD_LISTEN_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - nest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: lizard
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "9001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  egg:
    build:
      context: .
      target: egg
    profiles:
      - egg
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_INTERVAL_SECONDS: "15"
      LIZARD_CPU_PERCENT_THRESHOLDS: '[{"level":"warning","value":50},{"level":"critical","value":90}]'
    volumes:
      - /:/host:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  egg-test:
    build:
      context: .
      target: egg
    profiles:
      - test-hosts
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      LIZARD_MQTT_HOST: mqtt
      LIZARD_MQTT_PORT: "1883"
      LIZARD_INTERVAL_SECONDS: "5"
      LIZARD_CPU_PERCENT_THRESHOLDS: '[{"level":"warning","value":1},{"level":"critical","value":90}]'

volumes:
  mosquitto-data:
  mosquitto-log:
  prometheus-data:
  grafana-data:
